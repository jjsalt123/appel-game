<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appel-inspired Platformer</title>
  <style>
    :root {
      --sky: #7dd3fc;
      --sky2: #dbeafe;
      --ui-bg: rgba(15, 23, 42, 0.58);
      --ui-border: rgba(255,255,255,0.25);
      --text: #e2e8f0;
      --ground: #3b3b3b;
      --wall: #d97706;
      --platform: #f59e0b;
      --moveplatform: #8b5cf6;
      --apple: #facc15;
      --apple-stem: #7c2d12;
      --goal: #22c55e;
      --danger: #ef4444;
      --checkpoint: #e5e7eb;
      --checkpoint-on: #22c55e;
      --player: #111827;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(var(--sky), var(--sky2));
      border: none;
      image-rendering: auto;
    }

    .hud {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      display: flex;
      gap: 18px;
      align-items: center;
      background: var(--ui-bg);
      border: 2px solid var(--ui-border);
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.02em;
      z-index: 10;
      backdrop-filter: blur(6px);
    }

    .hud span { white-space: nowrap; }

    .controls {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      background: var(--ui-bg);
      border: 2px solid var(--ui-border);
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 14px;
      z-index: 10;
      backdrop-filter: blur(6px);
    }
  </style>
</head>

    <span id="levelLabel">Level 1</span>
    <span id="appleLabel">Apples: 0 / 0</span>
    <span id="statusLabel">Ready</span>
  </div>
  <div class="controls">Move: A/D or ←/→ &nbsp;•&nbsp; Jump: W / Space / ↑ &nbsp;•&nbsp; Restart: R</div>
  <canvas id="game"></canvas>

    function deepCopy(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
    function setStatus(str) { statusLabel.textContent = str; }

    function initLevel(index) {
      game.levelIndex = index;
      game.levels = deepCopy(levelData);
      const level = game.levels[index];

      player.x = level.spawn.x;
      player.y = level.spawn.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.facing = 1;
      player.wallSliding = false;
      player.wallDir = 0;
      player.checkpoint = { x: level.spawn.x, y: level.spawn.y };
      player.apples = 0;
      player.maxApples = level.apples.length;
      player.jumpBuffer = 0;
      player.coyote = 0;
      player.wallJumpCD = 0;

      level.apples.forEach(a => a.collected = false);
      level.checkpoints.forEach(c => c.activated = false);

      levelLabel.textContent = `Level ${index + 1}: ${level.name}`;
      appleLabel.textContent = `Apples: 0 / ${player.maxApples}`;
      setStatus("Ready");
      game.win = false;
      game.gameOver = false;
    }

    function currentLevel() { return game.levels[game.levelIndex]; }
    function getSolidRects() { const level = currentLevel(); return [...level.platforms, ...level.movingPlatforms]; }

    function updateMovingPlatforms(level) {
      for (const mp of level.movingPlatforms) {
        const prevX = mp.x;
        const prevY = mp.y;
        if (mp.axis === "x") {
          mp.x += mp.speed * mp.dir;
          if (mp.x <= mp.min || mp.x + mp.w >= mp.max) {
            mp.dir *= -1;
            mp.x = clamp(mp.x, mp.min, mp.max - mp.w);
          }
        } else {
          mp.y += mp.speed * mp.dir;
          if (mp.y <= mp.min || mp.y + mp.h >= mp.max) {
            mp.dir *= -1;
            mp.y = clamp(mp.y, mp.min, mp.max - mp.h);
          }
        }
        mp.dx = mp.x - prevX;
        mp.dy = mp.y - prevY;
      }
    }

    function updateCheckpoints(level) {
      for (const cp of level.checkpoints) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        const cpRect = { x: cp.x - 12, y: cp.y - 62, w: 24, h: 62 };
        if (!cp.activated && rectsOverlap(pRect, cpRect)) {
          cp.activated = true;
          player.checkpoint = { x: cp.x - 18, y: cp.y - 30 };
          setStatus("Checkpoint!");
        }
      }
    }

    function respawnPlayer() {
      player.x = player.checkpoint.x;
      player.y = player.checkpoint.y;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.wallSliding = false;
      player.wallDir = 0;
    }

    function checkSpikes(level) {
      for (const spike of level.spikes) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (rectsOverlap(pRect, spike)) {
          respawnPlayer();
          setStatus("Spiked!");
          return;
        }
      }
    }

    function checkEnemies(level) {
      for (const enemy of level.enemies) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        const eRect = { x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h };
        if (rectsOverlap(pRect, eRect)) {
          respawnPlayer();
          setStatus("Hit!");
          return;
        }

        enemy.x += enemy.speed * enemy.dir;
        if (enemy.x <= enemy.minX || enemy.x + enemy.w >= enemy.maxX) {
          enemy.dir *= -1;
          enemy.x = clamp(enemy.x, enemy.minX, enemy.maxX - enemy.w);
        }
      }
    }

    function collectApples(level) {
      for (const apple of level.apples) {
        if (!apple.collected) {
          const dx = (player.x + player.w / 2) - apple.x;
          const dy = (player.y + player.h / 2) - apple.y;
          const distSq = dx * dx + dy * dy;
          if (distSq < 1200) {
            apple.collected = true;
            player.apples += 1;
            setStatus("Apple!");
          }
        }
      }
    }

    function handleGoal(level) {
      const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
      const goalRect = { x: level.goal.x - 20, y: level.goal.y, w: level.goal.w + 40, h: level.goal.h };
      if (player.apples >= player.maxApples && rectsOverlap(pRect, goalRect)) {
        if (game.levelIndex < game.levels.length - 1) {
          setStatus("Level complete!");
          setTimeout(() => {
            game.levelIndex += 1;
            initLevel(game.levelIndex);
          }, 800);
        } else {
          setStatus("YOU WIN!");
          game.win = true;
          game.gameOver = true;
        }
      }
    }

    function detectWallTouch() {
      const rect = { x: player.x, y: player.y, w: player.w, h: player.h };
      for (const solid of getSolidRects()) {
        if (rectsOverlap(rect, solid)) {
          const leftDist = solid.x + solid.w - player.x;
          const rightDist = player.x + player.w - solid.x;
          if (Math.min(leftDist, rightDist) < 12) return true;
        }
      }
      return false;
    }

    function getWallSide() {
      const rect = { x: player.x, y: player.y, w: player.w, h: player.h };
      for (const solid of getSolidRects()) {
        if (rectsOverlap(rect, solid)) {
          const leftDist = solid.x + solid.w - player.x;
          const rightDist = player.x + player.w - solid.x;
          if (Math.min(leftDist, rightDist) < 12) {
            return leftDist < rightDist ? 1 : -1;
          }
        }
      }
      return 0;
    }

    function updatePlayer() {
      const level = currentLevel();
      if (game.win || game.gameOver) return;

      const left = keys.a || keys.arrowleft;
      const right = keys.d || keys.arrowright;

      if (player.jumpBuffer > 0) player.jumpBuffer -= 1;
      if (player.coyote > 0) player.coyote -= 1;
      if (player.wallJumpCD > 0) player.wallJumpCD -= 1;

      const accel = player.onGround ? WORLD.moveAccel : WORLD.airAccel;
      if (left) { player.vx -= accel; player.facing = -1; }
      if (right) { player.vx += accel; player.facing = 1; }
      if (!left && !right) {
        player.vx *= player.onGround ? WORLD.friction : 0.94;
        if (Math.abs(player.vx) < 0.05) player.vx = 0;
      }
      player.vx = clamp(player.vx, -WORLD.maxRun, WORLD.maxRun);

      const touchingWall = detectWallTouch();
      player.wallSliding = false;
      player.wallDir = 0;
      if (touchingWall && !player.onGround && player.vy >= 0) {
        const wallSide = getWallSide();
        player.wallSliding = true;
        player.wallDir = wallSide;
        if (player.vy > 0.5) player.vy *= 0.4;
      }

      const jumpRequested = player.jumpBuffer > 0;
      if (jumpRequested && (player.onGround || player.coyote > 0)) {
        player.vy = -WORLD.jumpStrength;
        player.onGround = false;
        player.jumpBuffer = 0;
        player.coyote = 0;
      } else if (jumpRequested && touchingWall && !player.onGround && player.wallJumpCD <= 0) {
        player.vy = -WORLD.wallJumpY;
        player.vx = WORLD.wallJumpX * -player.wallDir;
        player.jumpBuffer = 0;
        player.wallSliding = false;
        player.wallDir = 0;
        player.wallJumpCD = 6;
        setStatus("Wall Jump!");
      }

      player.vy += WORLD.gravity;

      player.x += player.vx;
      for (const rect of getSolidRects()) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (rectsOverlap(pRect, rect)) {
          if (player.vx > 0) player.x = rect.x - player.w;
          else if (player.vx < 0) player.x = rect.x + rect.w;
          player.vx = 0;
        }
      }

      player.y += player.vy;
      player.onGround = false;
      for (const rect of getSolidRects()) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (rectsOverlap(pRect, rect)) {
          if (player.vy > 0) {
            player.y = rect.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.coyote = WORLD.coyoteTime;
          } else if (player.vy < 0) {
            player.y = rect.y + rect.h;
            player.vy = 0;
          }
        }
      }

      for (const rect of level.movingPlatforms) {
        const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (player.onGround && rectsOverlap(pRect, rect)) {
          player.x += rect.dx || 0;
          player.y += rect.dy || 0;
        }
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > level.width) player.x = level.width - player.w;
      if (player.y > level.height + 300) respawnPlayer();

      updateCheckpoints(level);
      collectApples(level);
      checkSpikes(level);
      checkEnemies(level);
      handleGoal(level);

      appleLabel.textContent = `Apples: ${player.apples} / ${player.maxApples}`;
    }

    function updateCamera() {
      const targetX = clamp(player.x - canvas.width * 0.35, 0, currentLevel().width - canvas.width);
      const targetY = clamp(player.y - canvas.height * 0.5, 0, currentLevel().height - canvas.height);
      game.cameraTargetX = targetX;
      game.cameraTargetY = targetY;
      game.cameraX += (game.cameraTargetX - game.cameraX) * 0.14;
      game.cameraY += (game.cameraTargetY - game.cameraY) * 0.14;
    }

    function drawBackground(level) {
      ctx.fillStyle = level.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.12)";
      for (let i = 0; i < 12; i++) {
        const x = (i * 400 - (game.cameraX * 0.15)) % (canvas.width + 400);
        ctx.beginPath();
        ctx.ellipse(x, 120, 80, 40, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 50, 100, 60, 35, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlatforms(level) {
      for (const platform of level.platforms) {
        const x = platform.x - game.cameraX;
        const y = platform.y - game.cameraY;
        if (platform.type === "wall") {
          ctx.fillStyle = "#d97706";
          ctx.fillRect(x, y, platform.w, platform.h);
          ctx.fillStyle = "rgba(0,0,0,0.2)";
          ctx.fillRect(x, y, platform.w, 8);
        } else {
          ctx.fillStyle = "#f59e0b";
          ctx.fillRect(x, y, platform.w, platform.h);
          ctx.fillStyle = "rgba(0,0,0,0.15)";
          ctx.fillRect(x, y + platform.h - 12, platform.w, 12);
        }
      }

      for (const mp of level.movingPlatforms) {
        const x = mp.x - game.cameraX;
        const y = mp.y - game.cameraY;
        ctx.fillStyle = "#8b5cf6";
        ctx.fillRect(x, y, mp.w, mp.h);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.fillRect(x + 6, y + 6, mp.w - 12, 8);
      }
    }

    function drawApples(level) {
      for (const apple of level.apples) {
        if (apple.collected) continue;
        const x = apple.x - game.cameraX;
        const y = apple.y - game.cameraY;
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(x, y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#92400e";
        ctx.fillRect(x - 3, y + 14, 6, 18);
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(x - 8, y + 30, 16, 8);
      }
    }

    function drawCheckpoints(level) {
      for (const cp of level.checkpoints) {
        const x = cp.x - game.cameraX;
        const y = cp.y - game.cameraY;
        ctx.fillStyle = cp.activated ? "#22c55e" : "#e5e7eb";
        ctx.fillRect(x - 12, y - 60, 24, 60);
        ctx.fillStyle = cp.activated ? "#16a34a" : "#cbd5e1";
        ctx.beginPath();
        ctx.moveTo(x, y - 60);
        ctx.lineTo(x - 12, y - 75);
        ctx.lineTo(x + 12, y - 75);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawSpikes(level) {
      for (const spike of level.spikes) {
        const x = spike.x - game.cameraX;
        const y = spike.y - game.cameraY;
        ctx.fillStyle = "#374151";
        const count = Math.floor(spike.w / 18);
        for (let i = 0; i < count; i++) {
          ctx.beginPath();
          ctx.moveTo(x + i * 18, y + spike.h);
          ctx.lineTo(x + i * 18 + 9, y);
          ctx.lineTo(x + i * 18 + 18, y + spike.h);
          ctx.closePath();
          ctx.fill();
        }
      }
    }

    function drawEnemies(level) {
      for (const enemy of level.enemies) {
        const x = enemy.x - game.cameraX;
        const y = enemy.y - game.cameraY;
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(x, y, enemy.w, enemy.h);
        ctx.fillStyle = "#fca5a5";
        ctx.fillRect(x + 8, y + 8, 8, 8);
        ctx.fillRect(x + enemy.w - 16, y + 8, 8, 8);
      }
    }

    function drawGoal(level) {
      const x = level.goal.x - game.cameraX;
      const y = level.goal.y - game.cameraY;
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(x, y, level.goal.w, level.goal.h);
      ctx.fillStyle = "#bbf7d0";
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(x + 8 + i * 10, y + 12, 6, level.goal.h - 24);
      }
    }

    function drawPlayer() {
      const x = player.x - game.cameraX;
      const y = player.y - game.cameraY;
      ctx.fillStyle = "#111827";
      ctx.fillRect(x, y, player.w, player.h);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(x + 7, y + 12, 7, 7);
      ctx.fillRect(x + player.w - 14, y + 12, 7, 7);
      ctx.fillStyle = "#1f2937";
      const eyeOffset = player.facing === 1 ? 3 : 1;
      ctx.fillRect(x + 8 + eyeOffset, y + 14, 3, 3);
      ctx.fillRect(x + player.w - 13 + eyeOffset, y + 14, 3, 3);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + player.w / 2, y + 28, 8, 0, Math.PI);
      ctx.stroke();
      if (player.wallSliding) {
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(x + player.w / 2, y + 8);
        ctx.lineTo(x + player.w / 2 + player.wallDir * 16, y + 32);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    function drawWinOverlay() {
      if (!game.win && !game.gameOver) return;
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 72px Arial";
      ctx.textAlign = "center";
      ctx.fillText("YOU WIN!", canvas.width / 2, canvas.height / 2 - 40);
      ctx.font = "bold 32px Arial";
      ctx.fillText("All levels complete!", canvas.width / 2, canvas.height / 2 + 40);
      ctx.font = "24px Arial";
      ctx.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 100);
      ctx.textAlign = "left";
    }

    function render() {
      const level = currentLevel();
      drawBackground(level);
      drawPlatforms(level);
      drawSpikes(level);
      drawCheckpoints(level);
      drawEnemies(level);
      drawApples(level);
      drawGoal(level);
      drawPlayer();
      drawWinOverlay();
    }

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (["arrowup", "w", " ", "spacebar"].includes(key)) {
        if (!inputs.jumpHeld) {
          inputs.jumpHeld = true;
          player.jumpBuffer = WORLD.jumpBuffer;
        }
      }
      if (e.key === "r" || e.key === "R") initLevel(game.levelIndex);
    });

    window.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = false;
      if (["arrowup", "w", " ", "spacebar"].includes(key)) inputs.jumpHeld = false;
    });

    function gameLoop() {
      const level = currentLevel();
      updateMovingPlatforms(level);
      updatePlayer();
      updateCamera();
      render();
      requestAnimationFrame(gameLoop);
    }

    initLevel(0);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
